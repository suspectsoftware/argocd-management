apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-google-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-store
  target:
    name: argocd-secret # Merge into existing secret
    creationPolicy: Merge
    template:
      type: Opaque
      data:
        dex.google.clientID: "{{ .clientID | toString }}"
        dex.google.clientSecret: "{{ .clientSecret | toString }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: google-workspace-argo-oidc/client-id
    - secretKey: clientSecret
      remoteRef:
        key: google-workspace-argo-oidc/client-secret
