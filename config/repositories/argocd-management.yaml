apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: suspectsoftware-argocd-management
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-app-store
  target:
    name: suspectsoftware-argocd-management
    creationPolicy: Merge
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        githubAppID: "2678288"
        githubAppInstallationID: "104764666"
        githubAppPrivateKey: "{{ .appPrivateKey | toString }}"
        type: git
        url: https://github.com/suspectsoftware/argocd-management.git
  data:
    - secretKey: appPrivateKey
      remoteRef:
        key: argocd-github-app
        property: githubAppPrivateKey
