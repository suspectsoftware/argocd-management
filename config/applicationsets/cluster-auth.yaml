apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-auth
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: in-cluster
  source:
    repoURL: "https://github.com/egmontadministration/argo-management-cluster.git"
    path: config/applications/cluster-auth
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
