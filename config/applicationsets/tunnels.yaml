apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tunnel-cloudflared
  namespace: argocd
spec:
  project: in-cluster
  source:
    repoURL: https://github.com/suspectsoftware/argocd-management.git
    targetRevision: HEAD
    path: config/tunnels
  destination:
    name: in-cluster
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
