apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-store
  target:
    name: {{ .Values.name }}-token
    template:
      type: Opaque
      data:
        token: "{{ `{{ .tunnelToken | toString }}` }}"
  data:
    - secretKey: tunnelToken
      remoteRef:
        key: {{ required "tokenSecretKey is required" .Values.tokenSecretKey }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
data:
  config.yaml: |
    ingress:
{{- range $path, $content := .Files.Glob "routes/*.yaml" }}
{{- $routeFile := fromYaml (toString $content) }}
{{- range $routeFile.routes }}
      - hostname: {{ .hostname | quote }}
{{- with .path }}
        path: {{ . | quote }}
{{- end }}
        service: {{ .service | quote }}
{{- end }}
{{- end }}
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ (.Files.Glob "routes/*.yaml").AsConfig | sha256sum }}
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          command:
            - cloudflared
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
