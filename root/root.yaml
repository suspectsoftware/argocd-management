apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: in-cluster
  sources:
    # - repoURL: "https://github.com/suspectsoftware/argo-management-cluster.git"
    #   path: management-test/applicationsets
